# One command: docker compose up --build
# Web http://localhost:8080 | API http://localhost:4000/api | MailHog http://localhost:8025 | MinIO console http://localhost:9001
services:
  mongodb:
    image: mongo:7
    environment: { MONGO_INITDB_ROOT_USERNAME: sakshi, MONGO_INITDB_ROOT_PASSWORD: sakshi }
    ports: ["27017:27017"]
    volumes: [mongodata:/data/db]
    healthcheck: { test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"], interval: 5s, timeout: 5s, retries: 20 }
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment: { MINIO_ROOT_USER: minioadmin, MINIO_ROOT_PASSWORD: minioadmin }
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]
  mailhog:
    image: mailhog/mailhog:latest
    ports: ["1025:1025", "8025:8025"]
  backend:
    build: ./backend
    environment:
      DATABASE_URL: mongodb://sakshi:sakshi@mongodb:27017/sakshi?authSource=admin
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      SMTP_HOST: mailhog
      SMTP_PORT: "1025"
      JWT_SECRET: ${JWT_SECRET:-change-me-for-anything-beyond-a-demo}
      FILE_ENC_KEY: ${FILE_ENC_KEY:-5341404b5348492d323032362d44454d4f2d4b45592d4e4f542d464f522d5052}
      CORS_ORIGIN: http://localhost:8080,http://localhost:5173
      DEMO_MODE: ${DEMO_MODE:-true}
    depends_on:
      mongodb: { condition: service_healthy }
      redis: { condition: service_started }
      minio: { condition: service_started }
    ports: ["4000:4000"]
  frontend:
    build: ./frontend
    depends_on: [backend]
    ports: ["8080:80"]
volumes: { mongodata: {}, miniodata: {} }
