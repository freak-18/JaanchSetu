databases:
  - name: jaanchsetu-db
    databaseName: jaanchsetu
    user: jaanchsetu
    plan: free

services:
  - type: redis
    name: jaanchsetu-redis
    plan: free
    maxmemoryPolicy: noeviction

  - type: web
    name: jaanchsetu-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: node dist/main
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: jaanchsetu-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: jaanchsetu-redis
          type: redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: STORAGE_DRIVER
        value: local
      - key: MAIL_DISABLED
        value: "true"
      - key: PORT
        value: "4000"
      - key: CORS_ORIGIN
        value: "*"

  - type: web
    name: jaanchsetu-frontend
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
